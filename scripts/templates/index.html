<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Emotion Music Player</title>
    <style>
      /* Catppuccin Mocha color palette */
      :root {
        --rosewater: #f5e0dc;
        --flamingo: #f2cdcd;
        --pink: #f5c2e7;
        --mauve: #cba6f7;
        --red: #f38ba8;
        --maroon: #eba0ac;
        --peach: #fab387;
        --yellow: #f9e2af;
        --green: #a6e3a1;
        --teal: #94e2d5;
        --sky: #89dceb;
        --sapphire: #74c7ec;
        --blue: #89b4fa;
        --lavender: #b4befe;

        --text: #cdd6f4;
        --subtext1: #bac2de;
        --subtext0: #a6adc8;
        --overlay0: #9399b2;
        --overlay1: #7f849c;
        --overlay2: #6c7086;
        --surface0: #585b70;
        --surface1: #45475a;
        --surface2: #313244;
        --base: #1e1e2e;
        --mantle: #181825;
        --crust: #11111b;

        --windows-blue: #0078d4;
        --windows-gray-light: #f3f3f3;
        --windows-gray-medium: #e1e1e1;
        --windows-gray-dark: #3c3c3c;
      }

      /* Reset box sizing */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: var(--windows-gray-light);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        padding: 3rem 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .content {
        background: var(--base);
        color: var(--text);
        width: 90vw;
        max-width: 1300px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        padding: 40px 50px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
        outline: none;
        transition: box-shadow 0.3s ease;
      }
      .content:hover {
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
      }

      h1,
      h2 {
        font-weight: 600;
        margin: 0;
        line-height: 1.2;
        user-select: text;
        letter-spacing: 0.03em;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      }

      h1 {
        font-size: 2.5rem;
        color: var(--windows-blue);
      }

      h2 {
        font-size: 1.7rem;
        color: var(--peach);
      }

      /* Video feed */
      img {
        border-radius: 12px;
        width: 100%;
        max-width: 800px;
        max-height: 450px; /* 16:9 aspect ratio */
        object-fit: cover;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        user-select: none;
        transition: box-shadow 0.3s ease;
      }
      img:hover {
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      }

      /* Emotion selector styled as elegant form control */
      form {
        width: 100%;
        max-width: 400px;
      }

      select {
        width: 100%;
        padding: 14px 16px;
        font-size: 1.1rem;
        color: var(--windows-gray-dark);
        background-color: var(--surface0);
        border: 1.8px solid var(--windows-gray-medium);
        border-radius: 6px;
        font-weight: 700;
        cursor: pointer;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
        user-select: text;
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.7);
        position: relative;
        text-align-last: center;
      }
      select:hover {
        border-color: var(--windows-blue);
        box-shadow: 0 0 8px var(--windows-blue);
      }
      select:focus {
        border-color: var(--windows-blue);
        box-shadow: 0 0 12px var(--windows-blue);
        outline: none;
      }

      /* Now Playing text and description */
      #song-name {
        user-select: text;
        min-height: 1.8rem;
        margin-bottom: 0.4rem;
        letter-spacing: 0.02em;
      }
      #song-line {
        font-style: italic;
        color: var(--overlay1);
        user-select: text;
        min-height: 1.5rem;
        margin-top: 0;
      }

      /* Embedded YouTube player */
      iframe#song-video {
        width: 100%;
        max-width: 800px;
        height: 450px; /* 16:9 ratio */
        border-radius: 12px;
        border: none;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
        transition: opacity 0.4s ease;
        user-select: none;
      }

      /* Responsive */
      @media (max-width: 900px) {
        .content {
          width: 95vw;
          padding: 28px 32px;
        }
        iframe#song-video,
        img {
          max-width: 100%;
          height: auto;
        }
      }

      @media (max-width: 480px) {
        h1 {
          font-size: 1.8rem;
        }
        h2 {
          font-size: 1.2rem;
        }
        select {
          font-size: 1rem;
          padding: 10px 12px;
        }
      }
    </style>
  </head>
  <body>
    <main class="content" role="main" aria-label="Emotion Music Player">
      <img
        src="{{ url_for('video_feed') }}"
        alt="Live video feed showing your face"
        width="800"
        height="450"
        decoding="async"
        loading="lazy"
      />
      <h1 id="emotion-label">Emotion: {{ emotion.capitalize() }}</h1>

      <p id="song-line"></p>
      <iframe
        id="song-video"
        src=""
        allowfullscreen
        title="Currently playing song video"
        aria-label="Now playing song video"
      ></iframe>
      <h2 id="song-name">Now Playing: Unknown</h2>
    </main>

    <script>
      async function updateEmotionAndSong() {
        try {
          const response = await fetch("/current_emotion");
          if (!response.ok) throw new Error("Network response was not ok");
          const data = await response.json();

          document.getElementById("emotion-label").textContent =
            "Emotion: " + data.emotion;
          document.getElementById("song-name").textContent =
            "Now Playing: " + (data.song_name || "Unknown");
          document.getElementById("song-line").textContent =
            data.song_line || "";

          const videoFrame = document.getElementById("song-video");
          const newSrc = data.song_url
            ? data.song_url.replace("watch?v=", "embed/")
            : "";
          if (videoFrame.src !== newSrc) {
            videoFrame.src = newSrc;
          }
        } catch (error) {
          console.error("Failed to update emotion and song:", error);
        }
      }

      setInterval(updateEmotionAndSong, 1000); // update every 1 second
      window.onload = updateEmotionAndSong;
    </script>
  </body>
</html>
