<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Emotion Music Player</title>
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">

<body>
    <main class="content" role="main" aria-label="Emotion Music Player">
      <img
        src="{{ url_for('video_feed') }}"
        alt="Live video feed showing your face"
        width="800"
        height="450"
        decoding="async"
        loading="lazy"
      />
      <h1 id="emotion-label">Emotion: {{ emotion.capitalize() }}</h1>

      <p id="song-line"></p>
      <iframe
        id="song-video"
        src=""
        allowfullscreen
        title="Currently playing song video"
        aria-label="Now playing song video"
      ></iframe>
      <h2 id="song-name">Now Playing: Unknown</h2>
    </main>

    <div class="chatbox">
      <h2>AI Chatbot</h2>
      <div id="chat-messages"></div>
      <form id="chat-form" >
        <input type="text" id="chat-input" placeholder="Type your question..." />
        <button type="submit">Send</button>
      </form>
    </div>



    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

  </body>
</html>
